<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | CodeAlpha Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

width:420px;

background:#1e293b;

padding:45px;

border-radius:20px;

box-shadow:0 20px 45px rgba(0,0,0,.55);

border:1px solid #334155;

animation:show .6s;

}

@keyframes show{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h1{

text-align:center;

color:white;

margin-bottom:10px;

font-size:38px;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:30px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:white;

}

input{

width:100%;

padding:14px;

background:#334155;

color:white;

border:1px solid #475569;

border-radius:10px;

margin-bottom:20px;

font-size:16px;

}

input::placeholder{

color:#94a3b8;

}

input:focus{

outline:none;

border:1px solid #f59e0b;

}

button{

width:100%;

padding:15px;

background:#f59e0b;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#d97706;

}

.message{

padding:12px;

border-radius:8px;

margin-bottom:20px;

}

.success{

background:#d1fae5;

color:#065f46;

}

.error{

background:#fee2e2;

color:#991b1b;

}
.bottom{

margin-top:25px;

text-align:center;

color:#cbd5e1;

}

.bottom a{

color:#f59e0b;

font-weight:bold;

text-decoration:none;

}

.bottom a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="card">

<h1>Welcome Back</h1>

<p class="subtitle">

Login to continue shopping

</p>

{% if messages %}

{% for message in messages %}

<div class="message {% if message.tags == 'success' %}success{% else %}error{% endif %}">

{{ message }}

</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<label>👤 Username</label>

<input
type="text"
name="username"
required>

<label>🔒 Password</label>

<input
type="password"
name="password"
required>

<button>

Login

</button>

</form>

<div class="bottom">

Don't have an account?

<a href="{% url 'register' %}">

Register

</a>

</div>

</div>

</body>

</html>
