<!DOCTYPE html>
<html>

<head>

<title>Order Success</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{

width:600px;
background:#1e293b;
padding:60px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
box-shadow:0 20px 50px rgba(0,0,0,.5);

}

h1{
color:#22c55e;
font-size:46px;
margin-top:20px;
margin-bottom:20px;
}

p{

margin-top:15px;
font-size:20px;
color:#cbd5e1;
line-height:32px;

}

a{

display:inline-block;
margin-top:35px;
padding:15px 35px;
background:#f59e0b;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:600;
transition:.3s;

}

a:hover{

background:#d97706;
transform:translateY(-3px);

}
.order{

margin:35px 0;
padding:20px;
background:#0f172a;
border:1px solid #334155;
border-radius:12px;

}

.order h3{

color:#22c55e;
margin-bottom:10px;

}

</style>

</head>

<body>

<div class="box">

<div style="font-size:90px;margin-bottom:20px;">
✅
</div>

<h1>Order Placed!</h1>

<p>
Thank you for shopping with <b>CodeAlpha Store</b>.<br>
Your order has been confirmed successfully.
</p>

<div class="order">
    <h3>Order ID : CA2026001</h3>
    <p>Estimated Delivery : <b>3 - 5 Business Days</b></p>
</div>

<a href="/">
Back to Home
</a>

</div>

</body>

</html>
