<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

    width:550px;
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.15);

}

.icon{

    font-size:80px;
    color:#16a34a;

}

h1{

    color:#16a34a;
    margin-top:20px;
    margin-bottom:15px;

}

p{

    color:#555;
    font-size:18px;
    line-height:30px;

}

.order{

    margin:30px 0;
    background:#ecfdf5;
    padding:20px;
    border-radius:10px;

}

.order h3{

    color:#065f46;

}

.btn{

    display:inline-block;
    margin-top:30px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:14px 35px;
    border-radius:8px;
    transition:.3s;

}

.btn:hover{

    background:#1d4ed8;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">
✅
</div>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for shopping with <b>CodeAlpha Store</b>.
Your order has been confirmed.
</p>

<div class="order">

<h3>Order ID : CA2026001</h3>

<br>

<p>Estimated Delivery : <b>3 - 5 Business Days</b></p>

</div>

<a href="/" class="btn">
Continue Shopping
</a>

</div>

</body>
</html>
